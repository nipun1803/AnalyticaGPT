name: Deploy to EC2

on:
  push:
    branches: [ main ]

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Deploy to EC2 via SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USER }}
          key: ${{ secrets.EC2_SSH_KEY }}
          script: |
            # Navigate to the project directory (adjust path if needed)
            cd ~/AnalyticaGPT || git clone https://github.com/${{ github.repository }}.git ~/AnalyticaGPT && cd ~/AnalyticaGPT
            
            # Pull latest changes
            git pull origin main
            
            # Rebuild and restart containers
            # Using --build to ensure code changes are picked up
            sudo docker-compose up -d --build
            
            # Clean up old images to save space on cheap instances
            sudo docker image prune -f
