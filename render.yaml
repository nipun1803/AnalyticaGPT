services:
  - type: web
    name: insightforge-backend
    env: python
    buildCommand: "python -m pip install --upgrade pip && pip install -r backend/requirements.txt"
    startCommand: "cd backend && gunicorn -w 4 -k uvicorn.workers.UvicornWorker main:app --bind 0.0.0.0:$PORT"
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.6
      - key: DATABASE_URL
        fromDatabase:
          name: insightforge-db
          property: connectionString
      - key: REDIS_URL
        fromService:
          type: redis
          name: insightforge-redis
          property: connectionString
      - key: JWT_SECRET
        generateValue: true
      - key: CORS_ORIGINS
        value: "*" # Change this to frontend URL in production
      - key: GROQ_API_KEY
        sync: false

  - type: web
    name: insightforge-frontend
    env: static
    buildCommand: "cd frontend && npm install && npm run build"
    staticPublishPath: "./frontend/dist"
    envVars:
      - key: NODE_VERSION
        value: 20.11.0
      - key: VITE_API_BASE_URL
        fromService:
          type: web
          name: insightforge-backend
          property: url

  - type: redis
    name: insightforge-redis
    ipAllowList: [] # internal only

databases:
  - name: insightforge-db
    databaseName: insightforge
    user: admin
