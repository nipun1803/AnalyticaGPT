services:
  - type: web
    name: insightforge-backend
    env: python
    plan: free
    buildCommand: "python -m pip install --upgrade pip && pip install -r backend/requirements.txt --only-binary :all:"
    startCommand: "cd backend && gunicorn -w 4 -k uvicorn.workers.UvicornWorker main:app --bind 0.0.0.0:$PORT"
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.3
      - key: DATABASE_URL
        value: "sqlite:///./data/insightforge.db" # Default to SQLite for free tier
      - key: JWT_SECRET
        generateValue: true
      - key: CORS_ORIGINS
        value: "*"
      - key: GROQ_API_KEY
        sync: false

  - type: web
    name: insightforge-frontend
    env: static
    plan: free
    buildCommand: "cd frontend && npm install && npm run build"
    staticPublishPath: "./frontend/dist"
    envVars:
      - key: NODE_VERSION
        value: 20.11.0
